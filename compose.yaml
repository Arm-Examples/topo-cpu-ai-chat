services:
  llama-server:
    platform: linux/arm64
    build:
      context: ./llama-inference
      args:
        MODEL: unsloth/SmolLM2-135M-Instruct-GGUF
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

x-topo:
  name: "Topo CPU AI Chat"
  description: |
    Complete LLM chat application optimized for Arm CPU inference.

    This project demonstrates running large language models on CPU
    using llama.cpp compiled with Arm baseline optimizations and
    accelerated using NEON SIMD and SVE (when supported and enabled).

    The stack includes:
    - Prebuilt llama.cpp server runtime
    - Quantized SmolLM2 135M model bundled in the image
    - Built-in web chat interface
    - No GPU required - pure CPU inference

    Perfect for demos and testing! The bundled SmolLM2-135M-Instruct model
    allows the project to run immediately without downloading additional models.

    Ideal for testing LLM workloads on Arm hardware without GPU dependencies
    while avoiding a source build during Template deployment.

  features:
    - "NEON"

  deployment_success_message: |
    Topo CPU AI Chat is running.

    Open http://<target-ip>:3000 in your browser to start chatting.

  args:
    MODEL:
      description: "Model artifact reference. Use a Hugging Face GGUF repo ID, repo ID plus filename separated by ':', or a direct .gguf URL."
      default: "unsloth/SmolLM2-135M-Instruct-GGUF"
      example: "unsloth/SmolLM2-135M-Instruct-GGUF:SmolLM2-135M-Instruct-Q4_K_M.gguf"
      hints:
        huggingface.task: text-generation
        file.format: gguf

